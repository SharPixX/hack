name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # explicit bash => `bash --noprofile --norc -eo pipefail`, so `cmd | tee log` fails when cmd fails
    shell: bash

env:
  HELM_VERSION: "3.22.0"
  KUBECONFORM_VERSION: "0.8.0"
  KUSTOMIZE_VERSION: "5.8.2"
  GITLEAKS_VERSION: "8.30.1"
  TRIVY_VERSION: "0.75.0"

jobs:
  lint:
    name: Static checks (yamllint, ansible-lint, shellcheck, kubeconform, helm, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history for the secret scan

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install linters and Kubernetes tooling (pinned)
        run: |
          CURL="curl --retry 5 --retry-all-errors -fsSL"
          pip install --quiet --retries 5 -r requirements-dev.txt
          ansible-galaxy collection install -r ansible/requirements.yml -p .ansible/collections
          $CURL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          $CURL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          KZ="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}"
          $CURL "${KZ}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin kustomize
          $CURL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          $CURL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: Lint and validate manifests
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: ./scripts/lint.sh 2>&1 | tee lint.log

      - name: Publish lint failure details as annotations
        if: failure()
        run: ./scripts/ci-annotate.sh lint.log "lint" 200

      - name: Secret scan of the full Git history (gitleaks)
        run: gitleaks git --redact --verbose .

      - name: Kubernetes misconfiguration scan (trivy, report only)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 k8s/

  e2e:
    name: E2E - kubeadm cluster on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Runner facts
        run: |
          lsb_release -ds; uname -r; nproc; free -h; df -h / /mnt

      - name: Prepare the runner like a fresh Ubuntu server
        run: |
          # GitHub images ship Docker + packaged containerd, which the lab replaces with
          # upstream containerd/runc (the playbook refuses to run next to them).
          sudo systemctl stop docker.socket docker containerd 2>/dev/null || true
          pkgs=$(dpkg-query -W -f='${Package} ${Status}\n' \
            | awk '/install ok installed/ && $1 ~ /^(docker|containerd|moby|runc)/ {print $1}' | xargs)
          echo "purging: ${pkgs:-none}"
          # shellcheck disable=SC2086
          [[ -z "$pkgs" ]] || sudo apt-get purge -y -qq $pkgs
          sudo rm -f /usr/local/bin/kubectl /usr/local/bin/helm /usr/local/bin/minikube /usr/local/bin/kind
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # Docker leaves FORWARD policy DROP behind; a fresh server has ACCEPT
          sudo iptables -P FORWARD ACCEPT
          df -h /

      - name: Deploy (first run)
        run: sudo ./deploy.sh 2>&1 | tee deploy-1.log

      - name: Re-deploy (idempotency check)
        run: |
          sudo SKIP_VERIFY=1 ./deploy.sh 2>&1 | tee deploy-2.log
          echo "--- tasks reported as changed on the second run:"
          grep -E '^changed:' deploy-2.log || echo "(none)"
          grep -A3 'PLAY RECAP' deploy-2.log

      - name: Smoke test after re-deploy
        run: sudo ./scripts/smoke-test.sh 2>&1 | tee smoke.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## E2E: kubeadm on $(lsb_release -ds)"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' smoke.log 2>/dev/null | tail -n 90 || true
            echo '```'
            echo '### Idempotency (second deploy run)'
            echo '```'
            grep -A3 'PLAY RECAP' deploy-2.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish smoke test results as annotations (visible without signing in)
        if: success()
        run: |
          {
            grep -A3 'PLAY RECAP' deploy-2.log || true
            echo "tasks reported as changed on the 2nd run:"
            awk '/^TASK \[/ {t=$0} /^changed:/ {print "  " t}' deploy-2.log | sort -u || true
          } > recap.log
          LEVEL=notice ./scripts/ci-annotate.sh recap.log "idempotency: PLAY RECAP of the 2nd deploy" 30
          LEVEL=notice ./scripts/ci-annotate.sh smoke.log "smoke test" 270

      - name: Collect diagnostics
        if: always()
        run: |
          sudo ./scripts/collect-diagnostics.sh diagnostics || true
          sudo chown -R "$(id -u):$(id -g)" diagnostics || true

      - name: Publish failure details as annotations
        if: failure()
        run: |
          for f in smoke.log deploy-2.log deploy-1.log; do
            if [[ -s $f ]]; then ./scripts/ci-annotate.sh "$f" "$f" 150; break; fi
          done
          ./scripts/ci-annotate.sh diagnostics/pods.txt "pods" 60

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ubuntu-24.04
          path: |
            diagnostics/
            deploy-*.log
            smoke.log
          retention-days: 30
