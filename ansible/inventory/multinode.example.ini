# Example multi-node inventory (copy to multinode.ini and adjust).
# Run from any Linux host with SSH access to the nodes:
#   INVENTORY=ansible/inventory/multinode.ini ./deploy.sh
# NOTE: set a dedicated free MetalLB range for multi-node clusters, e.g.
#   [all:vars]
#   lb_address_pool=192.168.56.240-192.168.56.250
[control_plane]
cp1 ansible_host=192.168.56.10

[workers]
worker1 ansible_host=192.168.56.11
worker2 ansible_host=192.168.56.12

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=ubuntu
ansible_become=true
lb_address_pool=192.168.56.240-192.168.56.250
