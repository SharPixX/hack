---
# containerd, runc and CNI plugins from the official upstream releases
# ("Option 1" in https://github.com/containerd/containerd/blob/main/docs/getting-started.md).
# Every artifact is verified against the sha256 pinned in group_vars/all/versions.yml.

- name: Refuse to run next to a distro/Docker containerd package
  ansible.builtin.package_facts:
    manager: apt

- name: Fail if a packaged containerd is installed
  ansible.builtin.assert:
    that:
      - "'containerd.io' not in ansible_facts['packages']"
      - "'containerd' not in ansible_facts['packages']"
    fail_msg: >-
      A packaged containerd (containerd / containerd.io) is installed. Remove it
      (and Docker) first: apt-get purge -y docker-ce docker-ce-cli containerd.io containerd
    quiet: true

- name: Create download cache directory
  ansible.builtin.file:
    path: "{{ containerd_download_dir }}"
    state: directory
    mode: "0755"

- name: Download containerd release
  ansible.builtin.get_url:
    url: "{{ containerd_release_url }}"
    dest: "{{ containerd_download_dir }}/containerd-{{ containerd_version }}.tar.gz"
    checksum: "{{ containerd_checksums.containerd }}"
    mode: "0644"

- name: Read installed containerd version
  ansible.builtin.command: /usr/local/bin/containerd --version
  register: containerd_installed
  changed_when: false
  failed_when: false

- name: Install containerd binaries into /usr/local/bin
  ansible.builtin.unarchive:
    src: "{{ containerd_download_dir }}/containerd-{{ containerd_version }}.tar.gz"
    dest: /usr/local
    remote_src: true
  when: ("v" ~ containerd_version) not in (containerd_installed.stdout | default(''))
  notify: Restart containerd

- name: Install runc
  ansible.builtin.get_url:
    url: "{{ containerd_runc_release_url }}"
    dest: /usr/local/sbin/runc
    checksum: "{{ containerd_checksums.runc }}"
    mode: "0755"
  notify: Restart containerd

- name: Download CNI plugins
  ansible.builtin.get_url:
    url: "{{ containerd_cni_plugins_release_url }}"
    dest: "{{ containerd_download_dir }}/cni-plugins-{{ cni_plugins_version }}.tgz"
    checksum: "{{ containerd_checksums.cni_plugins }}"
    mode: "0644"

- name: Create CNI directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/cni/bin
    - /etc/cni/net.d

- name: Remove default bridge CNI configs of other runtimes (podman, containerd examples)
  # they would be picked up by kubelet before Calico writes 10-calico.conflist
  ansible.builtin.file:
    path: "/etc/cni/net.d/{{ item }}"
    state: absent
  loop:
    - 87-podman-bridge.conflist
    - 87-podman.conflist
    - 10-containerd-net.conflist

- name: Read installed CNI plugins version marker
  ansible.builtin.slurp:
    src: /opt/cni/bin/.kube-gateway-lab-version
  register: containerd_cni_marker
  failed_when: false

- name: Install CNI plugins
  ansible.builtin.unarchive:
    src: "{{ containerd_download_dir }}/cni-plugins-{{ cni_plugins_version }}.tgz"
    dest: /opt/cni/bin
    remote_src: true
  when: (containerd_cni_marker.content | default('') | b64decode | trim) != cni_plugins_version

- name: Write CNI plugins version marker
  ansible.builtin.copy:
    dest: /opt/cni/bin/.kube-gateway-lab-version
    content: "{{ cni_plugins_version }}\n"
    mode: "0644"

- name: Resolve the pause (sandbox) image expected by this kubeadm version
  ansible.builtin.shell: >-
    set -o pipefail;
    {{ kubeadm_bin }} config images list --kubernetes-version v{{ kubernetes_version }} 2>/dev/null
    | grep '/pause:'
  args:
    executable: /bin/bash
  register: containerd_pause
  changed_when: false
  failed_when: false

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Configure containerd (systemd cgroups, pinned sandbox image)
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  vars:
    containerd_pause_image: "{{ containerd_pause.stdout | default('', true) | trim | default(pause_image_fallback, true) }}"
  notify: Restart containerd

- name: Install containerd systemd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    mode: "0644"
  notify: Restart containerd

- name: Configure crictl to talk to containerd
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
    mode: "0644"

- name: Enable and start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending containerd restarts before kubeadm runs
  ansible.builtin.meta: flush_handlers

- name: Wait for the CRI socket
  ansible.builtin.wait_for:
    path: /run/containerd/containerd.sock
    timeout: 60
