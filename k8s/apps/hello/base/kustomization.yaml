apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One "hello" variant: Deployment (nginx + Prometheus exporter sidecar), Service, PDB.
# Variants (../variants/v1, ../variants/v2) add a name suffix, a version label
# (also used in selectors) and their own version.conf.
labels:
  - pairs:
      app.kubernetes.io/name: hello
      app.kubernetes.io/part-of: kube-gateway-lab
    includeSelectors: false
    includeTemplates: true
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
configMapGenerator:
  - name: hello-nginx
    files:
      - nginx.conf
