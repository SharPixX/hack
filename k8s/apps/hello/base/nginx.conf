# nginx configuration of the demo "hello" service.
# - listens on 8080 as non-root (nginx-unprivileged image, read-only rootfs)
# - access log: one JSON object per line on stdout  -> collected by Fluentd
# - error log : plain text on stderr                 -> collected by Fluentd
# - /stub_status for nginx-prometheus-exporter (localhost only)
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;
    default_type text/plain;
    charset utf-8;
    keepalive_timeout 65;

    log_format json_access escape=json
        '{'
          '"time_iso8601":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"x_forwarded_for":"$http_x_forwarded_for",'
          '"request_id":"$http_x_request_id",'
          '"method":"$request_method",'
          '"host":"$host",'
          '"uri":"$request_uri",'
          '"protocol":"$server_protocol",'
          '"status":$status,'
          '"body_bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"user_agent":"$http_user_agent",'
          '"app_version":"$app_version",'
          '"pod":"$hostname"'
        '}';

    server {
        listen 8080 default_server;
        server_name _;

        # Sets $app_version (generated per variant by Kustomize)
        include /etc/nginx/app/version.conf;

        access_log /dev/stdout json_access;

        add_header X-App-Version $app_version always;
        add_header X-Pod $hostname always;

        # Main endpoint: deterministic, easy to assert in tests
        location = / {
            return 200 "Hello World!\n";
        }

        # Which backend served the request (used to demonstrate traffic splitting)
        location = /info {
            default_type application/json;
            return 200 '{"app":"hello","version":"$app_version","pod":"$hostname"}\n';
        }

        # Synthetic failure endpoint to exercise 5xx metrics, alerts and error logs
        location = /error {
            return 500 "Simulated failure\n";
        }

        # Probes (not logged)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = /stub_status {
            access_log off;
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            return 404 "Not Found\n";
        }
    }
}
