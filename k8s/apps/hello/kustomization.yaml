apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Demo application "hello" (namespace `demo`, owned by the application team):
#   two versions (stable v1 + canary v2), its HTTPRoutes and Envoy Gateway
#   policies, NetworkPolicies, Prometheus scraping and alerting rules.
namespace: demo
resources:
  - variants/v1
  - variants/v2
  - routes.yaml
  - traffic-policies.yaml
  - networkpolicies.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
