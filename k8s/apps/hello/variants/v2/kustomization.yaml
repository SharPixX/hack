apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Canary version: one fixed replica, receives 10% of the default traffic,
# 100% of requests with "X-Canary: always" and everything under /v2 (see ../../routes.yaml).
resources:
  - ../../base
nameSuffix: -v2
labels:
  - pairs:
      app.kubernetes.io/version: v2
    includeSelectors: true
    includeTemplates: true
configMapGenerator:
  - name: hello-version
    literals:
      - version.conf=set $app_version "v2";
patches:
  - target:
      kind: Deployment
      name: hello
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
