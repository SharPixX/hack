# Operator UIs are HTTPS-only: plain HTTP requests get a 301 to https://.
# (hello.lab.test is intentionally served on both listeners for easy testing.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: edge
spec:
  parentRefs:
    - name: public
      sectionName: http
  hostnames:
    - grafana.lab.test
    - prometheus.lab.test
    - alertmanager.lab.test
    - logs.lab.test
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
