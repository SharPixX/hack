# Private PKI for the lab, fully managed by cert-manager (no keys in Git):
#   selfsigned-bootstrap --> lab-root-ca (CA cert) --> ClusterIssuer lab-ca --> *.lab.test
# Export the CA to trust it: kubectl -n cert-manager get secret lab-root-ca -o jsonpath='{.data.ca\.crt}' | base64 -d
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: kube-gateway-lab root CA
  secretName: lab-root-ca
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-lab-test
  namespace: edge
spec:
  secretName: wildcard-lab-test-tls
  commonName: "*.lab.test"
  dnsNames:
    - lab.test
    - "*.lab.test"
  duration: 2160h # 90 days
  renewBefore: 360h # rotated automatically 15 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
