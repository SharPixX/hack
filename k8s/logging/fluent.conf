# Fluentd pipeline (DaemonSet, one agent per node)
#
#   /var/log/containers/*.log (CRI format)
#     -> tail + CRI regexp parser
#     -> kubernetes_metadata (namespace, pod, labels...)
#     -> JSON parsing of nginx (demo) and Envoy (gateway) access logs
#     -> OpenSearch indices:
#          app-demo-YYYY.MM.DD        nginx access/error logs of the demo app
#          gateway-access-YYYY.MM.DD  Envoy Gateway access logs
#          k8s-logs-YYYY.MM.DD        every other container
#
# Self-monitoring: Prometheus metrics on :24231/metrics, health on :24220.

<system>
  log_level info
  root_dir /var/log/fluentd
</system>

# Fluentd's own internal events are not shipped
<label @FLUENT_LOG>
  <match fluent.**>
    @type null
  </match>
</label>

# ---------------------------------------------------------------- monitoring
<source>
  @type prometheus
  @id in_prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_monitor
  @id in_prometheus_monitor
</source>

<source>
  @type prometheus_output_monitor
  @id in_prometheus_output_monitor
</source>

<source>
  @type prometheus_tail_monitor
  @id in_prometheus_tail_monitor
</source>

<source>
  @type monitor_agent
  @id in_monitor_agent
  bind 0.0.0.0
  port 24220
</source>

# ---------------------------------------------------------------- input
<source>
  @type tail
  @id in_tail_container_logs
  path /var/log/containers/*.log
  exclude_path ["/var/log/containers/fluentd-*_logging_*.log"]
  pos_file /var/log/fluentd/containers.log.pos
  tag kube.*
  read_from_head true
  follow_inodes true
  refresh_interval 5
  <parse>
    # CRI log line: <RFC3339Nano time> <stdout|stderr> <F|P> <message>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </parse>
</source>

# ---------------------------------------------------------------- enrichment
<filter kube.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  skip_container_metadata true
  skip_master_url true
  skip_namespace_metadata true
  # label keys like app.kubernetes.io/name -> app_kubernetes_io/name (OpenSearch-safe)
  de_dot true
</filter>

# nginx of the demo app: stdout = JSON access log, stderr = text error log
<filter kube.var.log.containers.*_demo_nginx-*.log>
  @type parser
  @id filter_parse_nginx_json
  key_name log
  reserve_data true
  reserve_time true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

<filter kube.var.log.containers.*_demo_nginx-*.log>
  @type record_transformer
  @id filter_nginx_log_type
  enable_ruby true
  <record>
    log_type ${record["stream"] == "stderr" ? "error" : "access"}
    service hello
  </record>
</filter>

# Envoy proxies of Gateway edge/public (pods envoy-edge-public-*): JSON access log on stdout
<filter kube.var.log.containers.envoy-edge-public-*_envoy-gateway-system_envoy-*.log>
  @type parser
  @id filter_parse_envoy_json
  key_name log
  reserve_data true
  reserve_time true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# ---------------------------------------------------------------- outputs
<match kube.var.log.containers.*_demo_*.log>
  @type opensearch
  @id out_os_app_demo
  @log_level info
  host "#{ENV['OPENSEARCH_HOST']}"
  port "#{ENV['OPENSEARCH_PORT']}"
  scheme "#{ENV['OPENSEARCH_SCHEME']}"
  logstash_format true
  logstash_prefix app-demo
  logstash_dateformat %Y.%m.%d
  suppress_type_name true
  include_tag_key true
  tag_key fluentd_tag
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  request_timeout 30s
  log_os_400_reason true
  <buffer>
    @type file
    path /var/log/fluentd/buffers/app-demo
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    chunk_limit_size 8MB
    total_limit_size 256MB
    overflow_action drop_oldest_chunk
    retry_type exponential_backoff
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match kube.var.log.containers.envoy-edge-public-*_envoy-gateway-system_envoy-*.log>
  @type opensearch
  @id out_os_gateway
  host "#{ENV['OPENSEARCH_HOST']}"
  port "#{ENV['OPENSEARCH_PORT']}"
  scheme "#{ENV['OPENSEARCH_SCHEME']}"
  logstash_format true
  logstash_prefix gateway-access
  logstash_dateformat %Y.%m.%d
  suppress_type_name true
  include_tag_key true
  tag_key fluentd_tag
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  request_timeout 30s
  log_os_400_reason true
  <buffer>
    @type file
    path /var/log/fluentd/buffers/gateway
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    chunk_limit_size 8MB
    total_limit_size 256MB
    overflow_action drop_oldest_chunk
    retry_type exponential_backoff
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match kube.**>
  @type opensearch
  @id out_os_k8s
  host "#{ENV['OPENSEARCH_HOST']}"
  port "#{ENV['OPENSEARCH_PORT']}"
  scheme "#{ENV['OPENSEARCH_SCHEME']}"
  logstash_format true
  logstash_prefix k8s-logs
  logstash_dateformat %Y.%m.%d
  suppress_type_name true
  include_tag_key true
  tag_key fluentd_tag
  reconnect_on_error true
  reload_on_failure true
  reload_connections false
  request_timeout 30s
  log_os_400_reason true
  <buffer>
    @type file
    path /var/log/fluentd/buffers/k8s
    flush_mode interval
    flush_interval 10s
    flush_thread_count 2
    chunk_limit_size 8MB
    total_limit_size 512MB
    overflow_action drop_oldest_chunk
    retry_type exponential_backoff
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>
