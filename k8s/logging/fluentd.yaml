apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
---
# kubernetes_metadata filter: read-only access to pod/namespace metadata
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd
    spec:
      serviceAccountName: fluentd
      priorityClassName: system-node-critical
      terminationGracePeriodSeconds: 30
      tolerations:
        # collect logs on every node, including control-plane nodes
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: fluentd
          image: docker.io/fluent/fluentd-kubernetes-daemonset:v1.19.3-debian-opensearch-1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: OPENSEARCH_HOST
              value: opensearch-cluster-master.logging.svc
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: OPENSEARCH_SCHEME
              value: http
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FLUENTD_CONF
              value: fluent.conf
          ports:
            - name: metrics
              containerPort: 24231
              protocol: TCP
            - name: monitor
              containerPort: 24220
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/plugins.json
              port: monitor
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/plugins.json
              port: monitor
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              memory: 512Mi
          securityContext:
            # root is required to read the root-owned 0640 CRI log files;
            # no capabilities, no privilege escalation, read-only host log mounts.
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/log/fluentd
      volumes:
        - name: config
          configMap:
            name: fluentd-config
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        # tail positions + file buffers survive pod restarts (no log loss / duplication)
        - name: state
          hostPath:
            path: /var/log/fluentd
            type: DirectoryOrCreate
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fluentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
