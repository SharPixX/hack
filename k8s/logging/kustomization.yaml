apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Log collection: Fluentd DaemonSet -> OpenSearch (installed by Helm, see platform/opensearch.yaml).
namespace: logging
labels:
  - pairs:
      app.kubernetes.io/part-of: kube-gateway-lab
    includeSelectors: false
resources:
  - fluentd.yaml
configMapGenerator:
  # hash suffix => a config change triggers a rolling restart of the DaemonSet
  - name: fluentd-config
    files:
      - fluent.conf
