apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Observability glue owned by the platform team:
#   extra scrape targets (Envoy data/control plane), platform alerts,
#   Grafana dashboard (picked up by the Grafana sidecar), UI routes + auth policies.
resources:
  - monitors.yaml
  - platform-rules.yaml
  - ui-routes.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard-kube-gateway-lab
    namespace: monitoring
    files:
      - dashboards/kube-gateway-lab.json
    options:
      labels:
        grafana_dashboard: "1"
