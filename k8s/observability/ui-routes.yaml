# Operator UIs published through the same Gateway (HTTPS only, see edge/https-redirect).
# Prometheus, Alertmanager and OpenSearch Dashboards have no own login in this lab,
# so they are protected by Envoy Gateway basic auth (SecurityPolicy). The htpasswd
# Secrets are generated at deploy time with random passwords (`make credentials`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https
  hostnames:
    - grafana.lab.test
  rules:
    - backendRefs:
        - name: grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https
  hostnames:
    - prometheus.lab.test
  rules:
    - backendRefs:
        - name: kps-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https
  hostnames:
    - alertmanager.lab.test
  rules:
    - backendRefs:
        - name: kps-alertmanager
          port: 9093
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opensearch-dashboards
  namespace: logging
spec:
  parentRefs:
    - name: public
      namespace: edge
      sectionName: https
  hostnames:
    - logs.lab.test
  rules:
    - backendRefs:
        - name: opensearch-dashboards
          port: 5601
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: basic-auth
  namespace: monitoring
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: alertmanager
  basicAuth:
    users:
      name: ui-basic-auth
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: basic-auth
  namespace: logging
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: opensearch-dashboards
  basicAuth:
    users:
      name: ui-basic-auth
