# Helm values: jetstack/cert-manager (issues the TLS certificate of the Gateway).
crds:
  enabled: true
  keep: true
replicaCount: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    interval: 30s
