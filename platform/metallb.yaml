# Helm values: metallb/metallb (L2 mode). Address pool is rendered by Ansible
# from `lb_address_pool` (roles/platform/templates/metallb-pool.yaml.j2).
speaker:
  frr:
    enabled: false # pure L2 announcements, no BGP/FRR sidecar
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
controller:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
prometheus:
  rbacPrometheus: true
  serviceAccount: kps-prometheus
  namespace: monitoring
  serviceMonitor:
    enabled: true
